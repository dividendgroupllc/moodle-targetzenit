name: Moodle plugin deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: moodle-plugin-deploy
  cancel-in-progress: false     # ketayotgan deploy o'ldirilmaydi, navbatda kutadi

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2      # oldingi commit bilan solishtirish uchun

      - name: PHP sintaksis tekshiruvi (qattiq to'siq)
        run: |
          err=0
          while IFS= read -r -d '' f; do
            php -l "$f" || err=1
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $err

      - name: Deploy skript sintaksisi
        run: bash -n scripts/deploy.sh

      - name: version.php tekshiruvi
        run: |
          grep -q "component = 'local_targetzenit'" version.php || { echo "::error::component nomi noto'g'ri"; exit 1; }
          grep -qE '\$plugin->version\s*=\s*[0-9]{10}' version.php || { echo "::error::version raqami YYYYMMDDXX formatida emas"; exit 1; }

      - name: Versiya oshirilganmi (eng muhim tekshiruv)
        # Moodle plaginni FAQAT version raqami oshganda yangilaydi. Oshirilmasa
        # kod serverga tushadi-yu, Moodle eski kodni keshda ushlab qolaveradi —
        # biz buni ikki marta boshdan kechirganmiz.
        run: |
          yangi=$(grep -oP '\$plugin->version\s*=\s*\K[0-9]+' version.php)
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "Birinchi commit — solishtirish shart emas"; exit 0
          fi
          eski=$(git show HEAD~1:version.php 2>/dev/null | grep -oP '\$plugin->version\s*=\s*\K[0-9]+' || echo 0)

          # Kod umuman o'zgarmagan bo'lsa (masalan faqat README) — talab qilmaymiz
          if git diff --quiet HEAD~1 HEAD -- '*.php' '*.js' '*.xml' '*.css'; then
            echo "Kod o'zgarmagan — versiya oshirish shart emas"; exit 0
          fi

          echo "eski=$eski yangi=$yangi"
          if [ "$yangi" -le "$eski" ]; then
            echo "::error::version.php dagi \$plugin->version OSHIRILMAGAN ($eski -> $yangi). Moodle o'zgarishni sezmaydi."
            exit 1
          fi

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Secretlarni tekshirish
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          err=0
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then echo "::error::$v secret o'rnatilmagan"; err=1; fi
          done
          exit $err

      - name: SSH sozlash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'bash -s' < scripts/deploy.sh

      - name: Sayt ishlayaptimi (yakuniy tasdiq)
        run: |
          for i in 1 2 3; do
            kod=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              "https://lms.target.erpcontrol.uz/" || echo 000)
            case "$kod" in
              200|302|303) echo "Sayt javob berdi: HTTP $kod"; exit 0 ;;
            esac
            echo "urinish $i: HTTP $kod"; sleep 15
          done
          echo "::error::Deploydan keyin sayt javob bermayapti"
          exit 1
